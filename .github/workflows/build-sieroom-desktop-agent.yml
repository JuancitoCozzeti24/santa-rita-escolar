name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_probe.py desktop_agent/event_listener_probe.py desktop_agent/vue_event_probe.py desktop_agent/editor_open_probe.py desktop_agent/editor_open_probe_v2.py desktop_agent/editor_contract_probe.py desktop_agent/launcher_v091.py desktop_agent/launcher_v092.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.9.2" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v092.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.9.2.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.9.2 - CONTRATO DEL EDITOR DE NOTA

          RESULTADO CONFIRMADO EN v0.9.1:
          - La selección del alumno objetivo funciona.
          - El segundo clic abre un input real de edición.
          - No hubo solicitudes POST/PUT/PATCH/DELETE al abrir.
          - Escape cerró el editor y la nota permaneció intacta.

          CAMBIO PRINCIPAL:
          - Abre una sola celda elegida y lee el contrato del editor SIN ESCRIBIR.
          - Inspecciona tag, type, role, name, id, class, maxlength, pattern, inputmode y atributos data-*.
          - Inspecciona ancestros y controles visibles cercanos sin activarlos.
          - Lee listeners de teclado/input/change/blur/click mediante CDP sin dispararlos.
          - No escribe A/B/C, no pulsa Enter para guardar y no activa botones.
          - Cierra con Escape y verifica que el texto de la calificación no cambió.

          IMPORTANTE: ENTER omite la prueba. Esta versión todavía no escribe calificaciones.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.9.2
          path: |
            dist/SIEROOM-Desktop-Agent-v0.9.2.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
