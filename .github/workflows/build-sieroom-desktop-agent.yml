name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_probe.py desktop_agent/editor_open_probe.py desktop_agent/launcher_v100rc1.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v1.0-RC1" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v100rc1.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v1.0-RC1.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent 1.0 RC1 - PREFLIGHT DE ESCRITURA VERIFICADA

          OBJETIVO:
          - Consolidar las sondas 0.9.x en un flujo simple de producto.
          - Detectar matrícula, alumno, columna/competencia y valor visible actual.
          - Permitir preparar un plan de una sola nota A/B/C.
          - Guardar un JSON auditable del plan en LOCALAPPDATA/SIEROOM/DesktopAgent/evidence.

          SEGURIDAD RC1:
          - La escritura está BLOQUEADA por diseño.
          - No modifica notas ni dispara el endpoint de guardado.
          - El contrato preparado apunta al verified writer existente: sieweb.save_grades_verified.

          USO:
          1) Abre el EXE y entra a Registro de Notas de SIEweb.
          2) Selecciona la pestaña SIEweb en la consola.
          3) Cuando aparezca el PRECHECK, escribe P para preparar una prueba.
          4) Elige alumno, columna y A/B/C.
          5) Revisa el PLAN DE ESCRITURA VERIFICADA. En RC1 no se ejecutará.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v1.0-RC1
          path: |
            dist/SIEROOM-Desktop-Agent-v1.0-RC1.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
