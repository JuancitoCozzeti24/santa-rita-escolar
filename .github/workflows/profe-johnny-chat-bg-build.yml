name: Build PROFE JOHNNY APP chat background

on:
  push:
    branches:
      - profe-johnny-chat-bg
    paths:
      - ".github/workflows/profe-johnny-chat-bg-build.yml"
      - "profe-johnny-app/apply_chat_bg.py"
      - "profe-johnny-app/chat_fondo_optimized.b64"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profe-johnny-chat-bg

      - name: Apply chat background
        run: python profe-johnny-app/apply_chat_bg.py

      - name: Verify source
        shell: bash
        run: |
          grep -q 'R.drawable.chat_fondo' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt
          grep -q 'versionName = "0.2.2"' profe-johnny-app/app/build.gradle.kts
          test -s profe-johnny-app/app/src/main/res/drawable/chat_fondo.jpg

      - name: Commit app changes
        shell: bash
        run: |
          rm -f profe-johnny-app/chat_fondo_optimized.b64 profe-johnny-app/apply_chat_bg.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profe-johnny-app
          if ! git diff --cached --quiet; then
            git commit -m "feat: use custom math artwork as chat background"
            git push origin HEAD:profe-johnny-chat-bg
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: profe-johnny-app
        run: gradle :app:assembleDebug --stacktrace -PPROFE_JOHNNY_API_BASE_URL=https://santa-rita-escolar-tcpb.onrender.com/profe-johnny/v1

      - name: Prepare artifact
        run: cp profe-johnny-app/app/build/outputs/apk/debug/app-debug.apk PROFE-JOHNNY-APP-v0.2.2-chat-bg.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROFE-JOHNNY-APP-v0.2.2-chat-bg
          path: PROFE-JOHNNY-APP-v0.2.2-chat-bg.apk
