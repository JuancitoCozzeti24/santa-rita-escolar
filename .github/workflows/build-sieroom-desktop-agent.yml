name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - "sieweb.py"
      - "config.py"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile sieweb.py config.py desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_mapper_rc2.py desktop_agent/grade_cell_mapper_rc3.py desktop_agent/grade_cell_probe.py desktop_agent/editor_open_probe.py desktop_agent/launcher_v100rc1.py desktop_agent/launcher_v100rc2.py desktop_agent/launcher_v100rc3.py desktop_agent/verified_writer_bridge.py desktop_agent/launcher_v100rc4.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v1.0-RC4" `
            --paths . `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v100rc4.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v1.0-RC4.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v1.0 RC4 - UNA SOLA ESCRITURA REAL VERIFICADA

          OBJETIVO:
          - RC4 puede ejecutar exactamente UNA escritura de nota.
          - Revalida sección, período, matrícula, alumno, cabecera API y valor actual antes de escribir.
          - Reutiliza SieWebClient.save_grades_verified y relee SIEweb después del PUT.
          - Exige una frase de confirmación exacta antes de cualquier modificación.

          PROTECCIONES RC4:
          - Solo A/B/C.
          - Solo una celda por ejecución.
          - DOM y API deben coincidir antes de escribir.
          - La matrícula DOM y API debe ser idéntica.
          - No sobrescribe una nota distinta ya existente.
          - Nivel de Logro (nivelEva=1) usa exclusivamente el modo explícito HF12.
          - Desempeño (nivelEva=3) conserva la protección histórica.
          - No envía notificaciones masivas.
          - Si la relectura no confirma el valor o detecta cambios inesperados, informa NO VERIFICADO y se detiene.
          - Tokens/cookies del navegador se usan solo en memoria y nunca se guardan en la evidencia.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v1.0-RC4
          path: |
            dist/SIEROOM-Desktop-Agent-v1.0-RC4.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
