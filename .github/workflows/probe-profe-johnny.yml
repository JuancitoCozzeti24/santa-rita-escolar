name: Probe PROFE JOHNNY APP Brain

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-profe-johnny.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for status endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://santa-rita-escolar-tcpb.onrender.com/profe-johnny/v1/status"
          for i in $(seq 1 24); do
            code=$(curl -sS -o status.json -w '%{http_code}' "$URL" || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then
              cat status.json
              exit 0
            fi
            sleep 10
          done
          echo "Status endpoint did not become ready"
          cat status.json || true
          exit 1

      - name: Probe safe timetable question
        shell: bash
        run: |
          curl -sS --fail-with-body \
            -H 'Content-Type: application/json' \
            -d '{"message":"¿Cuál es el horario de Matemática de quinto año?","grade":"5.º"}' \
            https://santa-rita-escolar-tcpb.onrender.com/profe-johnny/v1/chat | tee chat.json
          python - <<'PY'
          import json
          data=json.load(open('chat.json',encoding='utf-8'))
          assert data.get('reply'), data
          meta=data.get('meta') or {}
          assert meta.get('private_student_data_used') is False, meta
          print('reply_ok=', bool(data.get('reply')))
          print('source_count=', meta.get('source_count'))
          print('private_student_data_used=', meta.get('private_student_data_used'))
          PY
