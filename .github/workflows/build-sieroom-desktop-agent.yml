name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - "sieweb.py"
      - "config.py"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile sieweb.py config.py desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_mapper_rc2.py desktop_agent/grade_cell_mapper_rc3.py desktop_agent/grade_cell_probe.py desktop_agent/editor_open_probe.py desktop_agent/launcher_v100rc1.py desktop_agent/launcher_v100rc2.py desktop_agent/launcher_v100rc3.py desktop_agent/verified_writer_bridge.py desktop_agent/launcher_v100rc4.py desktop_agent/browser_auth_rc5.py desktop_agent/launcher_v100rc5.py desktop_agent/launcher_v100rc6.py desktop_agent/launcher_v100rc7.py desktop_agent/launcher_v100rc8.py desktop_agent/launcher_v100rc9.py desktop_agent/launcher_v100rc10.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v1.0-RC10" `
            --paths . `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v100rc10.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v1.0-RC10.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v1.0 RC10 - LOTE SECUENCIAL CON DOM ESTABILIZADO

          OBJETIVO RC10:
          - Corrige el falso bloqueo observado en RC9 cuando el DOM cambió de vacío a A entre preflight y ejecución sin que la API hubiera cambiado.
          - Antes de cada escritura vuelve a sincronizar la MISMA libreta re-seleccionando el período, sin recargar toda la SPA.
          - Exige dos lecturas DOM consecutivas idénticas antes de permitir el writer.
          - Mantiene todas las protecciones de RC9: preflight completo, frase exacta, no sobrescritura, lote pequeño, parada ante primer fallo y verificación API + navegador.

          PRUEBA SUGERIDA:
          - Abrir 2.º A / Matemática / 3.er período / Registro de Notas.
          - Preparar dos celdas: alumno 1, col 1, A; alumno 2, col 1, A.
          - Revisar el preflight.
          - Autorizar solo si ambos destinos son correctos.
          - RC10 debe sincronizar cada celda antes de escribir y no aceptar lecturas DOM transitorias.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v1.0-RC10
          path: |
            dist/SIEROOM-Desktop-Agent-v1.0-RC10.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
