<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    body{font-family:system-ui,sans-serif;width:340px;padding:14px}label{display:block;font-size:12px;margin-top:10px}input{width:100%;box-sizing:border-box;padding:8px}button{margin-top:12px;padding:8px 10px;width:100%}.small{font-size:12px;color:#444}
  </style>
</head>
<body>
  <strong>Johnny WhatsApp Assistant</strong>
  <label>Endpoint del servidor</label>
  <input id="endpoint" placeholder="https://tu-servicio.onrender.com">
  <label>Secreto del bridge</label>
  <input id="secret" type="password" placeholder="WHATSAPP_BRIDGE_SECRET">
  <button id="save">Guardar configuración</button>
  <button id="bridge">Abrir puente</button>
  <p id="status" class="small"></p>
  <script src="popup.js"></script>
</body>
</html>
