name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_probe.py desktop_agent/event_listener_probe.py desktop_agent/vue_event_probe.py desktop_agent/editor_open_probe.py desktop_agent/editor_open_probe_v2.py desktop_agent/launcher_v091.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.9.1" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v091.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.9.1.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.9.1 - PRUEBA CONTROLADA V2

          RESULTADO v0.9.0:
          - El clic único no abrió un editor nuevo.
          - No hubo solicitudes de escritura y la nota permaneció intacta.
          - El contrato Vue/Quasar confirma clickAlumno(...) en fila y clickEdicion() en celda.

          CAMBIO PRINCIPAL:
          - La prueba opcional ahora hace DOS pasos seguros:
            1) selecciona primero el alumno objetivo en su fila;
            2) después hace clic en su celda de nota.
          - Verifica el rótulo Estudiante: antes y después para confirmar selección.
          - Amplía la detección del editor mediante activeElement, inputs, combobox, contenteditable, q-menu/q-dialog y cambios visibles.
          - No escribe A/B/C ni ningún valor.
          - No activa Guardar/Enviar.
          - Envía Escape y verifica que el texto visible de la nota no cambió.

          IMPORTANTE: la interacción es opcional. ENTER omite la prueba.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.9.1
          path: |
            dist/SIEROOM-Desktop-Agent-v0.9.1.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
