name: Build SIEROOM Stable EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/performance_plan_stable.py"
      - "desktop_agent/classroom_visual_review.py"
      - "desktop_agent/launcher_stable.py"
      - "desktop_agent/browser_startup_rc19.py"
      - "desktop_agent/semantic_inspector.py"
      - "desktop_agent/browser_controller.py"
      - "sieweb.py"
      - "config.py"
      - ".github/workflows/build-sieroom-stable.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate stable sources
        shell: pwsh
        run: |
          python -m py_compile `
            sieweb.py `
            config.py `
            desktop_agent/main.py `
            desktop_agent/browser_controller.py `
            desktop_agent/semantic_inspector.py `
            desktop_agent/classroom_visual_review.py `
            desktop_agent/grade_cell_mapper_rc3.py `
            desktop_agent/launcher_v100rc1.py `
            desktop_agent/launcher_v100rc3.py `
            desktop_agent/launcher_v100rc9.py `
            desktop_agent/launcher_v100rc13.py `
            desktop_agent/launcher_v100rc15.py `
            desktop_agent/browser_startup_rc19.py `
            desktop_agent/performance_plan.py `
            desktop_agent/performance_plan_rc16.py `
            desktop_agent/performance_plan_rc18.py `
            desktop_agent/performance_plan_stable.py `
            desktop_agent/launcher_stable.py

      - name: Build stable executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent" `
            --paths . `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_stable.py

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent.exe"
          if (-not (Test-Path $exe)) { throw "No se generó $exe" }
          $item = Get-Item $exe
          Write-Host "EXE estable generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM DESKTOP AGENT - CANAL ESTABLE

          Este ejecutable mantiene el mismo nombre en futuras mejoras.

          CLASSROOM - FASE VISUAL 1:
          - Abre Classroom + SIEweb automáticamente.
          - En Classroom, tras inspeccionar la pestaña, ofrece R = revisión visual.
          - Busca curso y tarea por texto visible.
          - Abre la vista docente y detecta enlaces individuales de estudiantes.
          - Recorre entregas y abre adjuntos enlazados en pestañas temporales.
          - Guarda captura + JSON por estudiante y adjunto.
          - Esta fase es SOLO LECTURA: no comenta, no califica y no devuelve.

          SIEWEB:
          - Mantiene el motor estable de criterios y notas ya validado.
          - No escribe notas hasta verificar criterios y destino.

          PRUEBA CLASSROOM:
          1) Selecciona la pestaña Classroom en la consola.
          2) Tras el reporte semántico, escribe R.
          3) Escribe curso/sección y parte exacta del título de la tarea.
          4) Para la primera prueba inspecciona 1 o 2 entregas.
          5) Revisa el resumen final; no se habrá publicado nada.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload stable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Stable
          path: |
            dist/SIEROOM-Desktop-Agent.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
