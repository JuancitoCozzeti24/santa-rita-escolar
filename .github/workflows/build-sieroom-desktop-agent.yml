name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_probe.py desktop_agent/event_listener_probe.py desktop_agent/vue_event_probe.py desktop_agent/launcher_v08.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.8.0" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v08.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.8.0.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.8.0 - VUE/QUASAR HANDLER PROBE SOLO LECTURA

          CAMBIOS PRINCIPALES:
          - Conserva 28 estudiantes, 4 competencias y 112 celdas mapeadas.
          - Conserva la detección CDP de listeners click en celda y ancestro.
          - Inspecciona el objeto handler/originalHandler sin ejecutar eventos.
          - Busca wrappers Vue y propiedades como fns/value/handler/invoker.
          - Busca marcadores Vue en la celda y sus ancestros (__vue__, _vei, __vnode, etc.).
          - Puede revelar la función real detrás del wrapper genérico de vendor.js.
          - No hace clic, no enfoca, no escribe y no modifica calificaciones.

          Esta versión sigue siendo SOLO LECTURA.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.8.0
          path: |
            dist/SIEROOM-Desktop-Agent-v0.8.0.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
