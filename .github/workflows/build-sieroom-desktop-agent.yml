name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_mapper_rc2.py desktop_agent/grade_cell_mapper_rc3.py desktop_agent/grade_cell_probe.py desktop_agent/editor_open_probe.py desktop_agent/launcher_v100rc1.py desktop_agent/launcher_v100rc2.py desktop_agent/launcher_v100rc3.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v1.0-RC3" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v100rc3.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v1.0-RC3.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v1.0 RC3 - PREFLIGHT CON LECTURA SEGURA DEL VALOR ACTUAL

          CORRECCION RC3:
          - RC2 detectó correctamente las 4 competencias, pero podía confundir nombres de iconos UI
            (por ejemplo COMMENT / VIEW_HISTORY) con el valor visible de una celda vacía.
          - RC3 elimina iconos/controles auxiliares antes de leer la calificación actual.
          - Solo considera confiable un valor vacío o una calificación reconocida AD/A/B/C.
          - Si el valor actual no puede leerse con confianza, el preflight queda BLOQUEADO.

          SEGURIDAD:
          - Esta RC3 NO escribe notas.
          - La escritura real sigue bloqueada.
          - El plan auditable exige alumno, competencia, matrícula completa y valor actual confiable.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v1.0-RC3
          path: |
            dist/SIEROOM-Desktop-Agent-v1.0-RC3.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
