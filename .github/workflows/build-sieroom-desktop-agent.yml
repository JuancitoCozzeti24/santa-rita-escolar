name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.1.1" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.1.1.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.1.1 - Fase 1 SOLO LECTURA

          CAMBIO IMPORTANTE:
          Esta versión abre Chrome/Edge como navegador normal y luego se conecta
          localmente para inspeccionarlo. Se hizo para mejorar la compatibilidad
          con Google Classroom.

          1. Cierra cualquier SIEROOM Desktop Agent v0.1 anterior.
          2. Ejecuta SIEROOM-Desktop-Agent-v0.1.1.exe.
          3. Si Windows SmartScreen pregunta, pulsa Más información > Ejecutar de todas formas.
          4. Inicia sesión en Google si este perfil dedicado todavía no lo está.
          5. Espera a que Classroom cargue completamente.
          6. Vuelve a la consola del agente y presiona ENTER para generar el reporte.

          Esta versión NO escribe notas, comentarios ni datos.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.1.1
          path: |
            dist/SIEROOM-Desktop-Agent-v0.1.1.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
