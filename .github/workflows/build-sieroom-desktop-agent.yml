name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_probe.py desktop_agent/event_listener_probe.py desktop_agent/launcher_v07.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.7.0" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v07.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.7.0.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.7.0 - EVENT LISTENERS SOLO LECTURA

          CAMBIOS PRINCIPALES:
          - Conserva la identificación de 28 estudiantes, 4 columnas y 112 celdas.
          - Conserva los encabezados semánticos de las cuatro competencias.
          - Usa Chrome DevTools Protocol para leer listeners registrados en las celdas y ancestros.
          - Busca click, dblclick, mouse/pointer, teclado, input, change y focus/blur.
          - Intenta identificar script, línea y URL origen del manejador.
          - No hace clic, no dispara eventos, no cambia valores y no envía notas.

          Esta versión sigue siendo SOLO LECTURA.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.7.0
          path: |
            dist/SIEROOM-Desktop-Agent-v0.7.0.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
