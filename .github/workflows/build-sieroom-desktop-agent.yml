name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.3.1" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.3.1.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.3.1 - MAPEO PROFUNDO SOLO LECTURA

          CAMBIOS PRINCIPALES:
          - Inspecciona el documento principal y todos los iframes adjuntos.
          - Detecta tablas HTML y grillas ARIA.
          - Detecta filas renderizadas con DIV por librerías como SlickGrid, AG Grid, jqGrid, Kendo y similares.
          - Reporta por frame dónde aparecen estudiantes, celdas y controles.
          - Puede leer valores actuales NO secretos para entender la estructura.
          - Excluye siempre password y hidden.

          Esta versión NO escribe notas, comentarios ni modifica datos.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.3.1
          path: |
            dist/SIEROOM-Desktop-Agent-v0.3.1.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
