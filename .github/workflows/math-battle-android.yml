name: Build Math Battle Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEY: ${{ secrets.MATH_BATTLE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Restore release keystore
        if: ${{ env.HAS_RELEASE_KEY != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MATH_BATTLE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/math-battle-release.jks"
      - name: Test and build debug APK
        env:
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        working-directory: math-battle-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_KEY != '' }}
        env:
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          MATH_BATTLE_KEYSTORE: ${{ runner.temp }}/math-battle-release.jks
          MATH_BATTLE_STORE_PASSWORD: ${{ secrets.MATH_BATTLE_STORE_PASSWORD }}
          MATH_BATTLE_KEY_ALIAS: ${{ secrets.MATH_BATTLE_KEY_ALIAS }}
          MATH_BATTLE_KEY_PASSWORD: ${{ secrets.MATH_BATTLE_KEY_PASSWORD }}
        working-directory: math-battle-android
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: math-battle-debug
          path: math-battle-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: math-battle-release-unsigned
          path: math-battle-android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish downloadable preview APKs
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp math-battle-android/app/build/outputs/apk/debug/app-debug.apk /tmp/Math-Battle-v1.0.0-debug.apk
          cp math-battle-android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/Math-Battle-v1.0.0-release-unsigned.apk
          gh release view math-battle-preview >/dev/null 2>&1 && \
            gh release upload math-battle-preview /tmp/Math-Battle-v1.0.0-debug.apk /tmp/Math-Battle-v1.0.0-release-unsigned.apk --clobber || \
            gh release create math-battle-preview /tmp/Math-Battle-v1.0.0-debug.apk /tmp/Math-Battle-v1.0.0-release-unsigned.apk --prerelease --target "$GITHUB_SHA" --title "Math Battle · versión preliminar" --notes "Compilación técnica para pruebas. Firebase todavía debe configurarse antes de distribuirla a estudiantes."
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_RELEASE_KEY != '' }}
        with:
          name: math-battle-release
          path: math-battle-android/app/build/outputs/apk/release/app-release.apk
