name: Hotfix PROFE JOHNNY APP Chat Responsiveness

on:
  push:
    branches:
      - profe-johnny-app-v1
    paths:
      - ".github/workflows/profe-johnny-app-hotfix-chat.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profe-johnny-app-v1

      - name: Patch Android chat UX and timeouts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt')
          s = main.read_text(encoding='utf-8')

          if 'import androidx.compose.foundation.lazy.rememberLazyListState' not in s:
              s = s.replace(
                  'import androidx.compose.foundation.lazy.items\n',
                  'import androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.lazy.rememberLazyListState\n',
                  1,
              )
          if 'import androidx.compose.runtime.LaunchedEffect' not in s:
              s = s.replace(
                  'import androidx.compose.runtime.Composable\n',
                  'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\n',
                  1,
              )

          if 'val listState = rememberLazyListState()' not in s:
              s = s.replace(
                  'private fun ChatScreen(onBack: () -> Unit) {\n    val scope = rememberCoroutineScope()\n',
                  'private fun ChatScreen(onBack: () -> Unit) {\n    val scope = rememberCoroutineScope()\n    val listState = rememberLazyListState()\n',
                  1,
              )

          anchor = '    var sending by remember { mutableStateOf(false) }\n\n    Column(Modifier.fillMaxSize().background(Color(0xFFF6F2E8)).imePadding()) {'
          replacement = '''    var sending by remember { mutableStateOf(false) }\n\n    LaunchedEffect(messages.size) {\n        if (messages.isNotEmpty()) {\n            listState.animateScrollToItem(messages.lastIndex)\n        }\n    }\n\n    Column(Modifier.fillMaxSize().background(Color(0xFFF6F2E8)).imePadding()) {'''
          if 'LaunchedEffect(messages.size)' not in s:
              if anchor not in s:
                  raise SystemExit('sending/column anchor not found')
              s = s.replace(anchor, replacement, 1)

          lazy_anchor = '''        LazyColumn(\n            modifier = Modifier.weight(1f).fillMaxWidth().padding(horizontal = 14.dp),\n            verticalArrangement = Arrangement.spacedBy(9.dp)\n        ) {'''
          lazy_new = '''        if (sending) {\n            Text(\n                "Consultando información del colegio…",\n                color = Color(0xFF006C4F),\n                fontSize = 13.sp,\n                fontWeight = FontWeight.SemiBold,\n                modifier = Modifier.padding(horizontal = 16.dp, vertical = 4.dp)\n            )\n        }\n\n        LazyColumn(\n            state = listState,\n            modifier = Modifier.weight(1f).fillMaxWidth().padding(horizontal = 14.dp),\n            verticalArrangement = Arrangement.spacedBy(9.dp)\n        ) {'''
          if 'state = listState' not in s:
              if lazy_anchor not in s:
                  raise SystemExit('LazyColumn anchor not found')
              s = s.replace(lazy_anchor, lazy_new, 1)

          s = s.replace('connectTimeout = 12_000', 'connectTimeout = 15_000')
          s = s.replace('readTimeout = 25_000', 'readTimeout = 60_000')
          s = s.replace('Text(if (sending) "…" else "Enviar")', 'Text(if (sending) "Consultando…" else "Enviar")')
          main.write_text(s, encoding='utf-8')

          gradle = Path('profe-johnny-app/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode = 2', 'versionCode = 3', 1)
          g = g.replace('versionName = "0.2.0"', 'versionName = "0.2.1"', 1)
          gradle.write_text(g, encoding='utf-8')

          wf = Path('.github/workflows/profe-johnny-app-build2.yml')
          w = wf.read_text(encoding='utf-8')
          w = w.replace('PROFE-JOHNNY-APP-v0.2.0-base.apk', 'PROFE-JOHNNY-APP-v0.2.1-base.apk')
          w = w.replace('PROFE-JOHNNY-APP-v0.2.0-base', 'PROFE-JOHNNY-APP-v0.2.1-base')
          wf.write_text(w, encoding='utf-8')
          PY

      - name: Verify hotfix source
        shell: bash
        run: |
          grep -q 'readTimeout = 60_000' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt
          grep -q 'state = listState' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt
          grep -q 'Consultando información del colegio' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt
          grep -q 'versionName = "0.2.1"' profe-johnny-app/app/build.gradle.kts

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt profe-johnny-app/app/build.gradle.kts .github/workflows/profe-johnny-app-build2.yml
          git commit -m "fix: make Profe Johnny chat responsive on slow school lookups"
          git push origin HEAD:profe-johnny-app-v1
