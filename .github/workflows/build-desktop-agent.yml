name: Build SIEROOM Desktop Agent

on:
  workflow_dispatch:
  push:
    branches:
      - feat/desktop-agent-visual-first
    paths:
      - "desktop_agent/**"
      - "sieroom_desktop_launcher.py"
      - "classroom.py"
      - "config.py"
      - "requirements*.txt"
      - ".github/workflows/build-desktop-agent.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller
      - name: Run safety tests
        run: python -m unittest tests.test_desktop_journal tests.test_classroom_flow -v
      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name SIEROOM-Desktop-Agent-v0.4
          --collect-all playwright
          --collect-all fitz
          --collect-all keyring
          --collect-submodules desktop_agent
          --hidden-import PIL
          --hidden-import docx
          --hidden-import openpyxl
          --hidden-import pptx
          sieroom_desktop_launcher.py
      - name: Create test package
        shell: pwsh
        run: |
          Copy-Item DESKTOP_AGENT.md dist/DESKTOP_AGENT.md
          Compress-Archive -Path dist/SIEROOM-Desktop-Agent-v0.4.exe,dist/DESKTOP_AGENT.md -DestinationPath dist/SIEROOM-Desktop-Agent-v0.4.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-v0.4
          path: dist/SIEROOM-Desktop-Agent-v0.4.zip
          if-no-files-found: error
          retention-days: 14
