name: Test SieWeb email verification handling

on:
  pull_request:
    branches:
      - deploy/render-institucional-private-path
    paths:
      - sieweb.py
      - tests/test_sieweb_email_mfa.py
      - .github/workflows/test-sieweb-email-mfa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sieweb-mfa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "requests>=2.32,<3" "python-dotenv>=1,<2" "mcp[cli]>=1.28,<2"
      - name: Compile modified modules
        run: python -m py_compile sieweb.py tests/test_sieweb_email_mfa.py
      - name: Run security-code challenge tests (offline)
        run: python -m unittest discover -s tests -p 'test_sieweb_email_mfa.py' -v
