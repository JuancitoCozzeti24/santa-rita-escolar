name: Wire PROFE JOHNNY Bitacora Memory

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wire-profe-johnny-bitacora-memory.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Profe Johnny brain with bitacora memory
        run: python scripts/patch_profe_johnny_bitacora_memory.py

      - name: Verify syntax
        run: python -m py_compile profe_johnny_brain.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profe_johnny_brain.py
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: feed Profe Johnny memory from teacher bitacora"
          git push origin HEAD:main
