name: Test SieWeb email verification handling

on:
  pull_request:
    branches:
      - deploy/render-institucional-private-path
    paths:
      - sieweb.py
      - config.py
      - server.py
      - sieweb_browser_relay.py
      - browser_extension/**
      - tests/test_sieweb_email_mfa.py
      - tests/test_sieweb_browser_relay.py
      - tests/test_sieweb_async_dispatch.py
      - .github/workflows/test-sieweb-email-mfa.yml
  push:
    branches: [deploy/render-institucional-private-path]
    paths:
      - sieweb.py
      - config.py
      - sieweb_browser_relay.py
      - server.py
      - browser_extension/**
      - tests/test_sieweb_browser_relay.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sieweb-mfa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "requests>=2.32,<3" "python-dotenv>=1,<2" "mcp[cli]>=1.28,<2"
      - name: Compile modified modules
        run: python -m py_compile config.py sieweb.py sieweb_browser_relay.py server.py tests/test_sieweb_email_mfa.py tests/test_sieweb_browser_relay.py tests/test_sieweb_async_dispatch.py
      - name: Run security-code challenge tests (offline)
        run: |
          python -m unittest discover -s tests -p 'test_sieweb_email_mfa.py' -v
          python -m unittest discover -s tests -p 'test_sieweb_browser_relay.py' -v
          python -m unittest discover -s tests -p 'test_sieweb_async_dispatch.py' -v
      - name: Check extension script syntax
        run: node --check browser_extension/sieweb_bridge.js
      - name: Package updated extension
        uses: actions/upload-artifact@v4
        with:
          name: SieRoom-Bridge-SIEweb-MFA-R6.9
          path: browser_extension/
          if-no-files-found: error
