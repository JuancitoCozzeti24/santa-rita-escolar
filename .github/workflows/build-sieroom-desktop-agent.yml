name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.2.0" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.2.0.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.2.0 - EXPLORADOR SEMÁNTICO SOLO LECTURA

          CAMBIOS PRINCIPALES:
          - Mantiene el navegador abierto para inspeccionar varias pantallas sin reiniciar.
          - Reconoce tipos de pantalla de Classroom y SIEweb.
          - En SIEweb detecta selectores, tablas, encabezados y campos sin leer contraseñas ni valores de entrada.
          - Reconoce específicamente la pantalla Registro de Notas.
          - En Classroom identifica enlaces de cursos y actividades visibles.
          - Genera reporte básico, captura y reporte semántico JSON.

          Esta versión NO escribe notas, comentarios ni modifica datos.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.2.0
          path: |
            dist/SIEROOM-Desktop-Agent-v0.2.0.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
