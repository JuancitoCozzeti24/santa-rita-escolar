name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-1.0-rc1
    paths:
      - "desktop_agent/**"
      - "sieweb.py"
      - "config.py"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate RC1 sources
        shell: pwsh
        run: |
          python -m py_compile `
            desktop_agent/browser_controller.py `
            desktop_agent/grade_cell_mapper.py `
            desktop_agent/grade_cell_probe.py `
            desktop_agent/editor_open_probe.py `
            desktop_agent/roster_guard.py `
            desktop_agent/page_context.py `
            desktop_agent/verified_writer_bridge.py `
            desktop_agent/launcher_1_0_rc1.py `
            sieweb.py `
            config.py

      - name: Validate authoritative roster counts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "desktop_agent"
          python -c "from roster_guard import EXPECTED_COUNTS_2026; assert EXPECTED_COUNTS_2026 == {'S2A':28,'S2B':28,'S5A':25,'S5B':26}, EXPECTED_COUNTS_2026; print(EXPECTED_COUNTS_2026)"

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-1.0-RC1" `
            --paths desktop_agent `
            --paths . `
            --collect-all playwright `
            --hidden-import sieweb `
            --hidden-import config `
            --hidden-import requests `
            --hidden-import dotenv `
            desktop_agent/launcher_1_0_rc1.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-1.0-RC1.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          if ($item.Length -lt 1000000) {
            throw "El EXE es sospechosamente pequeño: $($item.Length) bytes"
          }
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent 1.0 RC1 — PREVIEW + VERIFIED WRITER

          ESTA YA NO ES UNA VERSION DE SONDA 0.9.x.

          OBJETIVO:
          - Reconocer Registro de Notas de SIEweb.
          - Verificar exactamente la nómina autorizada 2026 (2A, 2B, 5A, 5B).
          - Resolver sección, período, Matemática y la cabecera real.
          - Preparar UNA sola celda.
          - No escribir hasta que el usuario escriba exactamente: ESCRIBIR 1 CELDA
          - Guardar mediante save_grades_verified.
          - Releer SIEweb y declarar VERIFICADO solo si la persistencia queda confirmada.
          - En nivelEva=1 aplica HF12 y comprueba que no cambien celdas no objetivo.

          USO RC1:
          1. Ejecuta el EXE.
          2. En el Edge dedicado entra a SIEweb > Registro de Notas.
          3. Selecciona sección, 05 - Matemática y período.
          4. Vuelve a la consola y presiona ENTER.
          5. P solo PREPARA una nota. Elige explícitamente alumno, columna y A/B/C.
          6. Revisa el resumen. Solo la frase ESCRIBIR 1 CELDA habilita el PUT real.

          SEGURIDAD:
          - RC1 nunca hace lotes.
          - No envía notificaciones.
          - No guarda contraseña en archivos; primero intenta reutilizar la sesión de Edge.
          - Si la nómina, cabecera, contexto o verificación no coinciden, bloquea la escritura.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-1.0-RC1
          path: |
            dist/SIEROOM-Desktop-Agent-1.0-RC1.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
