name: Build PROFE JOHNNY APP crash fix

on:
  push:
    branches:
      - profe-johnny-chat-bg
    paths:
      - ".github/workflows/profe-johnny-chat-bg-build.yml"
      - "profe-johnny-app/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profe-johnny-chat-bg

      - name: Apply crash-safe chat hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''    LaunchedEffect(messages.size) {
        if (messages.isNotEmpty()) {
            listState.animateScrollToItem(messages.lastIndex)
        }
    }

    Box(Modifier.fillMaxSize().imePadding()) {
        Image(
            painter = painterResource(R.drawable.chat_fondo),
            contentDescription = "Fondo matemático del chat",
            contentScale = ContentScale.Crop,
            modifier = Modifier.fillMaxSize()
        )
        Box(
            Modifier
                .fillMaxSize()
                .background(Color.White.copy(alpha = 0.74f))
        )
'''
          new = '''    LaunchedEffect(messages.size) {
        if (messages.size > 1) {
            listState.scrollToItem(messages.lastIndex)
        }
    }

    Box(
        Modifier
            .fillMaxSize()
            .imePadding()
            .background(
                Brush.verticalGradient(
                    listOf(
                        Color(0xFFF7F3E8),
                        Color(0xFFEAF4EF),
                        Color(0xFFF7F3E8)
                    )
                )
            )
    ) {
'''
          if old not in s:
              raise SystemExit('Expected ChatScreen block was not found; refusing unsafe patch')
          p.write_text(s.replace(old, new), encoding='utf-8')

          g = Path('profe-johnny-app/app/build.gradle.kts')
          gs = g.read_text(encoding='utf-8')
          gs = gs.replace('versionCode = 4', 'versionCode = 5')
          gs = gs.replace('versionName = "0.2.2"', 'versionName = "0.2.3"')
          g.write_text(gs, encoding='utf-8')
          PY

      - name: Verify crash-safe chat source
        shell: bash
        run: |
          ! grep -q 'painter = painterResource(R.drawable.chat_fondo)' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt
          grep -q 'messages.size > 1' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt
          grep -q 'versionName = "0.2.3"' profe-johnny-app/app/build.gradle.kts
          grep -q 'Hola, soy el Profe Johnny. ¿En qué puedo ayudarte?' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt
          grep -q 'Consultando información' profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt

      - name: Create compile-time home media placeholders
        shell: bash
        run: |
          mkdir -p profe-johnny-app/app/src/main/res/raw
          mkdir -p profe-johnny-app/app/src/main/res/drawable
          printf 'PROFE_JOHNNY_VIDEO_PLACEHOLDER' > profe-johnny-app/app/src/main/res/raw/fondo_mate.mp4
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > profe-johnny-app/app/src/main/res/drawable/profe_johnny_logo.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: profe-johnny-app
        run: gradle :app:assembleDebug --stacktrace -PPROFE_JOHNNY_API_BASE_URL=https://santa-rita-escolar-tcpb.onrender.com/profe-johnny/v1

      - name: Prepare artifact
        run: cp profe-johnny-app/app/build/outputs/apk/debug/app-debug.apk PROFE-JOHNNY-APP-v0.2.3-CRASH-FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROFE-JOHNNY-APP-v0.2.3-CRASH-FIX
          path: PROFE-JOHNNY-APP-v0.2.3-CRASH-FIX.apk
