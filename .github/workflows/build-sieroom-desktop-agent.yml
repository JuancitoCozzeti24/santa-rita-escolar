name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - "sieweb.py"
      - "config.py"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile sieweb.py config.py desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_mapper_rc2.py desktop_agent/grade_cell_mapper_rc3.py desktop_agent/grade_cell_probe.py desktop_agent/editor_open_probe.py desktop_agent/launcher_v100rc1.py desktop_agent/launcher_v100rc2.py desktop_agent/launcher_v100rc3.py desktop_agent/verified_writer_bridge.py desktop_agent/launcher_v100rc4.py desktop_agent/browser_auth_rc5.py desktop_agent/launcher_v100rc5.py desktop_agent/launcher_v100rc6.py desktop_agent/launcher_v100rc7.py desktop_agent/launcher_v100rc8.py desktop_agent/launcher_v100rc9.py desktop_agent/launcher_v100rc10.py desktop_agent/launcher_v100rc11.py desktop_agent/launcher_v100rc12.py desktop_agent/launcher_v100rc13.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v1.0-RC13" `
            --paths . `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v100rc13.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v1.0-RC13.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v1.0 RC13 - GUARDADO RAPIDO REAL

          OBJETIVO RC13:
          - Corrige el hallazgo de RC12: escribir en el editor nativo con Tab cambiaba el DOM, pero no persistia la nota en SIEweb.
          - Hace un unico preflight de la libreta.
          - Agrupa las notas por competencia/cabecera y usa la sesion autenticada del navegador para persistir varias notas sin recargar entre alumnos.
          - No deja valores temporales sin guardar en la pestaña.
          - Al terminar hace una verificacion API global.
          - Solo despues de confirmar el servidor actualiza UNA vez la misma libreta, conservando Salon, Curso y Periodo, y verifica la pantalla.
          - Admite hasta 28 celdas por lote.

          PRUEBA SUGERIDA:
          - Mantener abierta la libreta correcta de SIEweb.
          - Usar 2 celdas vacias de prueba.
          - Autorizar con GUARDAR RAPIDO 2.
          - Debe guardar ambas sin recargar entre estudiantes y actualizar la libreta una sola vez al final.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v1.0-RC13
          path: |
            dist/SIEROOM-Desktop-Agent-v1.0-RC13.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
