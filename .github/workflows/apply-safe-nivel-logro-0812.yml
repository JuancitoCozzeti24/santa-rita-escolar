name: Apply safe Nivel de logro 0.8.12

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-safe-nivel-logro-0812.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply source patch and compile
        run: python apply_safe_nivel_logro_0812.py

      - name: Verify low-level update remains blocked
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('server_core.py').read_text(encoding='utf-8')
          assert 'if action == "update_grades":' in s
          block = s[s.index('if action == "update_grades":'):]
          assert '"blocked": True' in block[:900]
          assert 'allow_achievement_level' in s
          assert Path('VERSION.txt').read_text(encoding='utf-8').strip() == '0.8.12'
          print('SOURCE_GUARDS_OK')
          PY

      - name: Commit integrated source
        run: |
          git config user.name "OpenAI SIEROOM maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sieweb.py server_core.py VERSION.txt
          git rm apply_safe_nivel_logro_0812.py .github/workflows/apply-safe-nivel-logro-0812.yml
          git commit -m "feat: safely enable verified Nivel de logro writes"
          git push origin HEAD:main
