name: Build PROFE JOHNNY APP Classroom Test

on:
  push:
    branches:
      - profe-johnny-classroom-test
    paths:
      - ".github/workflows/profe-johnny-classroom-test.yml"
      - "profe-johnny-app/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: profe-johnny-classroom-test

      - name: Apply unified access-code gate
        shell: bash
        run: |
          python profe-johnny-app/apply_access_code_gate.py
          python profe-johnny-app/apply_clean_chat_format.py
          sed -i 's/versionCode = 6/versionCode = 8/' profe-johnny-app/app/build.gradle.kts
          sed -i 's/versionName = "0.3.0"/versionName = "0.4.0"/' profe-johnny-app/app/build.gradle.kts

      - name: Verify unified secure access
        shell: bash
        run: |
          set -euo pipefail
          FILE='profe-johnny-app/app/src/main/java/pe/profejohnny/app/MainActivity.kt'
          grep -q 'Ingresa tu código de acceso' "$FILE"
          grep -q 'private data class AccessSession' "$FILE"
          grep -q '.put("role", "auto")' "$FILE"
          grep -q '\$base/secure-chat' "$FILE"
          grep -q 'Cambiar acceso' "$FILE"
          grep -q 'Modo docente · Profe Johnny' "$FILE"
          grep -q 'versionName = "0.4.0"' profe-johnny-app/app/build.gradle.kts
          grep -q 'versionCode = 8' profe-johnny-app/app/build.gradle.kts

      - name: Create compile-time media placeholders
        shell: bash
        run: |
          mkdir -p profe-johnny-app/app/src/main/res/raw
          mkdir -p profe-johnny-app/app/src/main/res/drawable
          printf 'PROFE_JOHNNY_VIDEO_PLACEHOLDER' > profe-johnny-app/app/src/main/res/raw/fondo_mate.mp4
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > profe-johnny-app/app/src/main/res/drawable/profe_johnny_logo.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: profe-johnny-app
        run: gradle :app:assembleDebug --stacktrace -PPROFE_JOHNNY_API_BASE_URL=https://santa-rita-escolar-tcpb.onrender.com/profe-johnny/v1

      - name: Prepare artifact
        run: cp profe-johnny-app/app/build/outputs/apk/debug/app-debug.apk PROFE-JOHNNY-APP-v0.4.0-CODIGO-UNICO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROFE-JOHNNY-APP-v0.4.0-CODIGO-UNICO
          path: PROFE-JOHNNY-APP-v0.4.0-CODIGO-UNICO.apk

      - name: Prepare Android signing tools
        shell: bash
        run: |
          mkdir -p android-signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-signing-tools/
          mkdir -p android-signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" android-signing-tools/lib64/

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools-35
          path: android-signing-tools/
