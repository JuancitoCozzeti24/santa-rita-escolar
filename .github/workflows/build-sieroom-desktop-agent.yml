name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_probe.py desktop_agent/event_listener_probe.py desktop_agent/vue_event_probe.py desktop_agent/editor_open_probe.py desktop_agent/editor_open_probe_v2.py desktop_agent/editor_contract_probe.py desktop_agent/editor_handler_probe.py desktop_agent/editor_closure_probe.py desktop_agent/editor_closure_probe_fast.py desktop_agent/editor_component_probe.py desktop_agent/editor_component_probe_v2.py desktop_agent/launcher_v091.py desktop_agent/launcher_v092.py desktop_agent/launcher_v093.py desktop_agent/launcher_v094.py desktop_agent/launcher_v095.py desktop_agent/launcher_v096.py desktop_agent/launcher_v097.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.9.7" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v097.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.9.7.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.9.7 - TRAZA REAL Symbol(_assign) -> COMPONENTE

          RESULTADO DE v0.9.6:
          - La prueba termino correctamente y volvió al menú por diseño.
          - v0.9.6 capturó el HTMLInputElement, no el componente Vue real.
          - Por eso aparecieron muchos TypeError: Illegal invocation y blur [native code].

          CAMBIO PRINCIPAL:
          - Localiza Symbol(_assign) del input, confirmado antes como function(a){return e.nota=a}.
          - Inspecciona la closure de ESA función para capturar el e que contiene nota.
          - Lee propiedades/funciones relevantes sin invocar getters ni callbacks.
          - NO escribe notas y cierra el editor con Escape.
          - Después de la prueba E, el agente termina automáticamente para no volver al menú 1/2.

          Esta versión sigue siendo SOLO LECTURA sobre calificaciones.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.9.7
          path: |
            dist/SIEROOM-Desktop-Agent-v0.9.7.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
