name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
    paths:
      - "desktop_agent/**"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile desktop_agent/main.py desktop_agent/browser_controller.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v0.1" `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v0.1.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v0.1 - Fase 1 SOLO LECTURA

          1. Asegúrate de tener Google Chrome instalado.
          2. Ejecuta SIEROOM-Desktop-Agent-v0.1.exe.
          3. Windows SmartScreen puede mostrar una advertencia porque esta versión de prueba aún no está firmada digitalmente.
          4. El agente abrirá un perfil de Chrome exclusivo para SIEROOM.
          5. Inicia sesión la primera vez y navega a Classroom o SIEweb.
          6. Vuelve a la ventana del agente y presiona ENTER para generar el reporte.

          Esta versión NO escribe notas, comentarios ni datos.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v0.1
          path: |
            dist/SIEROOM-Desktop-Agent-v0.1.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
