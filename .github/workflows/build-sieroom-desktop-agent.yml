name: Build SIEROOM Desktop Agent EXE

on:
  workflow_dispatch:
  push:
    branches:
      - sieroom-desktop-agent-v0.1
      - sieroom-desktop-agent-v0.1-rc15-code
    paths:
      - "desktop_agent/**"
      - "sieweb.py"
      - "config.py"
      - ".github/workflows/build-sieroom-desktop-agent.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: desktop_agent/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop_agent/requirements.txt
          python -m pip install "pyinstaller>=6.15,<7"

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile sieweb.py config.py desktop_agent/main.py desktop_agent/browser_controller.py desktop_agent/semantic_inspector.py desktop_agent/gradebook_mapper.py desktop_agent/grade_cell_mapper.py desktop_agent/grade_cell_mapper_rc2.py desktop_agent/grade_cell_mapper_rc3.py desktop_agent/grade_cell_probe.py desktop_agent/editor_open_probe.py desktop_agent/launcher_v100rc1.py desktop_agent/launcher_v100rc2.py desktop_agent/launcher_v100rc3.py desktop_agent/verified_writer_bridge.py desktop_agent/launcher_v100rc4.py desktop_agent/browser_auth_rc5.py desktop_agent/launcher_v100rc5.py desktop_agent/launcher_v100rc6.py desktop_agent/launcher_v100rc7.py desktop_agent/launcher_v100rc8.py desktop_agent/launcher_v100rc9.py desktop_agent/launcher_v100rc10.py desktop_agent/launcher_v100rc11.py desktop_agent/launcher_v100rc12.py desktop_agent/launcher_v100rc13.py desktop_agent/launcher_v100rc14.py desktop_agent/performance_plan.py desktop_agent/launcher_v100rc15.py

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "SIEROOM-Desktop-Agent-v1.0-RC15" `
            --paths . `
            --paths desktop_agent `
            --collect-all playwright `
            desktop_agent/launcher_v100rc15.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/SIEROOM-Desktop-Agent-v1.0-RC15.exe"
          if (-not (Test-Path $exe)) {
            throw "No se generó $exe"
          }
          $item = Get-Item $exe
          Write-Host "EXE generado: $($item.FullName)"
          Write-Host "Tamaño: $($item.Length) bytes"

      - name: Add quick-start file
        shell: pwsh
        run: |
          @"
          SIEROOM Desktop Agent v1.0 RC15 - PLAN DOCENTE + DESEMPENOS + NOTAS MASIVAS

          OBJETIVO RC15:
          - Conserva el guardado rápido verificado de RC14.
          - Añade SIEROOM_PLAN.json como contrato entre ChatGPT/Skill docente y el agente Windows.
          - Antes de registrar notas, valida la libreta visible y crea SOLO los desempeños precisados faltantes.
          - Reutiliza desempeños que ya existan exactamente una vez y bloquea duplicados/ambigüedades.
          - Actualiza la misma libreta una sola vez después de crear desempeños.
          - Si el plan contiene grades, prepara hasta 112 celdas y las guarda por lotes agrupados, sin recargar por alumno.
          - Si el plan no contiene grades, permite continuar con el lote manual rápido.
          - Exige confirmación separada para crear desempeños y para guardar calificaciones.

          PRUEBA SEGURA:
          - Abre Registro de notas en la sección/curso/período correctos.
          - Ejecuta RC15 y elige P.
          - Si no existe SIEROOM_PLAN.json, RC15 creará una plantilla en Descargas SIN modificar SIEweb.
          - El plan final será generado por ChatGPT/Skill docente; no debes inventar ni redactar desempeños manualmente.
          "@ | Set-Content -Encoding UTF8 dist/LEEME-PRIMERO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SIEROOM-Desktop-Agent-Windows-v1.0-RC15
          path: |
            dist/SIEROOM-Desktop-Agent-v1.0-RC15.exe
            dist/LEEME-PRIMERO.txt
          if-no-files-found: error
          retention-days: 14
